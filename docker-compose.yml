services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /data
      KNOWLEDGE_BASE_DIR: /app/knowledge_base
      FRONTEND_ORIGIN: http://localhost:5173
      EXTERNAL_AI_ENABLED: ${EXTERNAL_AI_ENABLED:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
