[project]
name = "formsathi-backend"
version = "1.0.0"
requires-python = ">=3.11"
description = "FormSathi FastAPI backend"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
