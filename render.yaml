services:
  - type: web
    name: formsathi
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: KNOWLEDGE_BASE_DIR
        value: /app/knowledge_base
      - key: USE_LIGHT_EMBEDDINGS
        value: "true"
      - key: EXTERNAL_AI_ENABLED
        value: "true"
      - key: FRONTEND_ORIGIN
        value: https://formsathi-o6oq.onrender.com
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: ELEVENLABS_MODEL_ID
        value: eleven_v3
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
